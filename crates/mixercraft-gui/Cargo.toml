[package]
name = "mixercraft-gui"
description = "MixerCraft desktop mixer (Slint). Talks to the engine over IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "mixercraft-gui"
path = "src/main.rs"

[dependencies]
mixercraft-config.workspace = true
mixercraft-ipc.workspace = true
mixercraft-hotkey.workspace = true
mixercraft-platform.workspace = true
serde.workspace = true
mixercraft-update.workspace = true
slint.workspace = true
toml.workspace = true

[build-dependencies]
slint-build.workspace = true
winresource.workspace = true

[lints]
workspace = true

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon.workspace = true
png.workspace = true

# Linux tray: StatusNotifierItem over D-Bus (KDE, GNOME with the AppIndicator
# extension, most other desktops), no GTK. async-io instead of tokio: zbus
# already uses it for accessibility.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
png.workspace = true
