[package]
name = "mixercraft-gui"
description = "MixerCraft desktop mixer (Slint). Talks to the engine over IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "mixercraft-gui"
path = "src/main.rs"

[dependencies]
mixercraft-config.workspace = true
mixercraft-ipc.workspace = true
mixercraft-platform.workspace = true
serde.workspace = true
slint.workspace = true
toml.workspace = true

[build-dependencies]
slint-build.workspace = true
winresource.workspace = true

[lints]
workspace = true

# The tray needs a GTK main loop on Linux; it is enabled on Windows and macOS
# for now (see docs/feature-matrix.md).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon.workspace = true
png.workspace = true
