[package]
name = "mixercraft-update"
description = "Checks a release feed for new MixerCraft versions, downloads and verifies installers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
semver = "1.0.28"
sha2 = "0.10"
# HTTPS with rustls (ring) and the operating system's certificate store; no
# OpenSSL and no bundled root list.
ureq = { version = "3.1", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
