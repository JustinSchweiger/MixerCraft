[workspace]
resolver = "3"
members = [
    "crates/mixercraft-core",
    "crates/mixercraft-config",
    "crates/mixercraft-ipc",
    "crates/mixercraft-usbip",
    "crates/mixercraft-winaudio",
    "crates/mixercraft-denoise",
    "crates/mixercraft-platform",
    "crates/mixercraft-engine",
    "crates/mixercraft-cli",
    "crates/mixercraft-gui",
    "crates/mixercraft-update",
]
# Throwaway evaluation prototypes; not part of the product build or CI.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JustinSchweiger/MixerCraft"
authors = ["MixerCraft contributors"]

[workspace.dependencies]
mixercraft-core = { path = "crates/mixercraft-core" }
mixercraft-config = { path = "crates/mixercraft-config" }
mixercraft-ipc = { path = "crates/mixercraft-ipc" }
mixercraft-platform = { path = "crates/mixercraft-platform" }
mixercraft-usbip = { path = "crates/mixercraft-usbip" }
mixercraft-winaudio = { path = "crates/mixercraft-winaudio" }
mixercraft-denoise = { path = "crates/mixercraft-denoise" }
mixercraft-update = { path = "crates/mixercraft-update" }

anyhow = "1.0.100"
ctrlc = "3.4"
clap = { version = "4.5", features = ["derive", "env"] }
# `realtime`: WASAPI/ALSA callback threads join the OS real-time audio class
# (MMCSS on Windows); without it a CPU spike delays the engine.
cpal = { version = "0.18.2", features = ["realtime"] }
audio_thread_priority = { version = "0.35", default-features = false }
directories = "6.0.0"
interprocess = "2.2"
rtrb = "0.4.1"
nnnoiseless = { version = "0.5.2", default-features = false }
slint = { version = "~1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
slint-build = "1.19.0"
tray-icon = "0.26.1"
png = "0.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.0"
tracing = "0.1.41"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"

# DSP code is unusably slow (and glitches) without optimisation; keep debug
# builds of the real-time core optimised.
[profile.dev.package.mixercraft-core]
opt-level = 2

# Noise suppression (RNNoise) is far too slow unoptimised for a debug engine.
[profile.dev.package.mixercraft-denoise]
opt-level = 2

[profile.dev.package.realfft]
opt-level = 2

[profile.dev.package.rustfft]
opt-level = 2
