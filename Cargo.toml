[workspace]
resolver = "3"
members = [
    "crates/mixercraft-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JustinSchweiger/MixerCraft"
authors = ["MixerCraft contributors"]

[workspace.dependencies]
mixercraft-core = { path = "crates/mixercraft-core" }
mixercraft-config = { path = "crates/mixercraft-config" }
mixercraft-ipc = { path = "crates/mixercraft-ipc" }
mixercraft-platform = { path = "crates/mixercraft-platform" }

anyhow = "1.0.100"
ctrlc = "3.4"
clap = { version = "4.5", features = ["derive", "env"] }
cpal = "0.18.2"
directories = "6.0.0"
interprocess = "2.2"
rtrb = "0.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"

# DSP code is unusably slow (and glitches) without optimisation; keep debug
# builds of the real-time core optimised.
[profile.dev.package.mixercraft-core]
opt-level = 2
