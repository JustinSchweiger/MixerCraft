name: Supply chain

on:
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/security.yml"]
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories surface even without code changes.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny ${{ matrix.checks }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    # New advisories must not block unrelated pull requests; they fail the
    # scheduled run instead, where they get triaged.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check ${{ matrix.checks }}
