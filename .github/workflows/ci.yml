name: CI

# Documentation-only changes skip CI: the repository is private, so Actions
# minutes are limited (macOS runners count 10x, Windows 2x) and a full run
# costs about 50 minutes. Run it manually (workflow_dispatch) if needed.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:

# Least privilege: CI only reads the repository. No secrets are used here, so
# untrusted pull requests cannot reach signing or publishing credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # Linux build dependencies: ALSA (cpal default host), PipeWire + libclang
  # (optional native PipeWire host, bindgen), fontconfig/xkbcommon/wayland
  # (Slint GUI on Linux).
  LINUX_DEPS: libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64", os: ubuntu-24.04 }
          - { name: "Linux ARM64", os: ubuntu-24.04-arm }
          - { name: "Windows x86_64", os: windows-2025 }
          - { name: "macOS ARM64", os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Test (release, real-time core)
        # Optimised builds exercise different code generation in the DSP paths.
        run: cargo test -p mixercraft-core --release --locked
      - name: Native PipeWire host
        if: runner.os == 'Linux'
        run: cargo clippy -p mixercraft-platform --features pipewire --locked

  cross:
    name: ${{ matrix.name }} (check)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows ARM64", os: windows-2025, target: aarch64-pc-windows-msvc }
          - { name: "macOS x86_64", os: macos-15, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --workspace --locked --target ${{ matrix.target }}

  # Virtual devices against a real PipeWire daemon (dummy driver, no audio
  # hardware): tone -> virtual sink -> engine -> virtual source -> recorder.
  pipewire:
    name: Linux PipeWire virtual devices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies and PipeWire
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS pipewire pipewire-bin wireplumber dbus-daemon python3
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p mixercraft-engine -p mixercraft-cli
      - name: Virtual devices end to end
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -c '
            pipewire & sleep 1
            wireplumber & sleep 3
            pw-cli info 0 | head -3
            scripts/test-pipewire-virtual.sh target/debug'

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --locked

  # Unsigned development binaries from main. These are NOT releases: releases
  # are built by a separate, manually approved workflow (see
  # docs/development/workflow.md).
  dev-build:
    name: Dev build ${{ matrix.name }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, check]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, exe: "" }
          - { name: windows-x86_64, os: windows-2025, exe: ".exe" }
          - { name: macos-arm64, os: macos-15, exe: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p mixercraft-engine -p mixercraft-cli -p mixercraft-gui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mixercraft-dev-${{ matrix.name }}
          path: |
            target/release/mixercraftd${{ matrix.exe }}
            target/release/mixercraft${{ matrix.exe }}
            target/release/mixercraft-gui${{ matrix.exe }}
          retention-days: 14
